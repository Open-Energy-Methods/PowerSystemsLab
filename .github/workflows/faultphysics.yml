name: FaultPhysics qualification
on:
  pull_request:
    paths:
      - 'benchmarks/faultphysics/**'
      - '.github/workflows/faultphysics.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  faults:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r benchmarks/m0/requirements.txt
      - run: python -m pip freeze > faultphysics-environment.txt
      - run: python -m unittest discover -s benchmarks/faultphysics -v
      - run: python benchmarks/faultphysics/native.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: faultphysics
          path: |
            faultphysics-results.json
            faultphysics-environment.txt
